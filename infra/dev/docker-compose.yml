# Local dev stack. Values come from infra/dev/.env (written by `pnpm bootstrap`);
# the defaults below work without it.
name: ${COMPOSE_PROJECT_NAME:-app-dev}

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Catches every email the app sends in dev: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILPIT_PORT:-8025}:8025" # Web UI

volumes:
  postgres-data:
